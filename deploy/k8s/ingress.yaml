apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lantern
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: lantern-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: lantern.192-168-56-83.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lantern
                port: { number: 8080 }
